server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;      # React single-page app
    }

    location /api/ {
        proxy_pass http://backend:8000/; # "backend" = Compose service name (DNS)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
