services:
  backend:
    build: ./backend
    image: weather-backend:1.0
    container_name: weather-backend
    environment:
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?Set OPENWEATHER_API_KEY in .env}
    restart: unless-stopped
    networks: [weathernet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    image: weather-frontend:1.0
    container_name: weather-frontend
    ports:
      - "3000:8080"          # host 3000 -> nginx 8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [weathernet]

networks:
  weathernet:
